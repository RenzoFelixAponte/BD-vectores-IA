services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./back/data:/app/back/data
      - ./datasets:/app/datasets
      - ./scripts/benchmarks/results:/app/scripts/benchmarks/results
    restart: unless-stopped

volumes:
  pgvector_data:
